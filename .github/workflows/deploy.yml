name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ] # Προσοχή: Αν το branch σου λέγεται 'master', άλλαξέ το εδώ σε 'master'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # Εδώ αφαιρέσαμε το "cache: npm" που σου έβγαζε το error

      - name: Install dependencies
        run: npm install
        # Εδώ χρησιμοποιούμε "install" αντί για "ci"

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
